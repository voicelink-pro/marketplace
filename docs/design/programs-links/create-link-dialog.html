<!doctype html>
<html lang="en">
<head>
<!-- boostlink mockup: example numbers only. Reference for layout, spacing and copy; build with existing components and tokens. -->
<meta charset="utf-8">
<title>Create link dialog</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050505}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
</style>

<div style="min-height: 780px; background: #050505; color: #f5f5f5; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; padding: 40px; box-sizing: border-box">
<div role="dialog" aria-labelledby="cl-title" style="width: 520px; background: #161616; border: 1px solid #2a2a2a; border-radius: 20px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; position: relative">
<button type="button" aria-label="Close" style="position: absolute; right: 16px; top: 16px; width: 32px; height: 32px; border-radius: 10px; border: 0; background: transparent; color: #9ca3af; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
<div style="display: flex; flex-direction: column; gap: 6px"><h2 id="cl-title" style="margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em">Create link</h2><span style="font-size: 14px; color: #9ca3af">Make one for each place you post, so you can see which one works.</span></div>

<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 600">Program
<button type="button" style="height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #2a2a2a; background: #0b0b0b; color: #f5f5f5; font-family: inherit; font-size: 14px; display: flex; align-items: center; gap: 10px; text-align: left"><span style="width: 24px; height: 24px; border-radius: 7px; background: #8b5cf6; color: #fff; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center">L</span><span style="flex-grow: 1; font-weight: 600">Lexi Notes</span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px; color: #9ca3af"><path d="m6 9 6 6 6-6"></path></svg></button></label>

<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 600">Where will you post it?</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; font-size: 13px; font-weight: 600">
<button type="button" aria-pressed="true" style="height: 64px; border-radius: 14px; border: 1.5px solid #ffd600; background: rgba(255, 214, 0, 0.08); color: #f5f5f5; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><span style="width: 24px; height: 24px; border-radius: 7px; background: #000; border: 1px solid #3a3a3a; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg></span>TikTok</button>
<button type="button" style="height: 64px; border-radius: 14px; border: 1px solid #2a2a2a; background: #0b0b0b; color: #c9ccd1; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><span style="width: 24px; height: 24px; border-radius: 7px; background: #e1306c; color: #fff; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px"><rect width="20" height="20" x="2" y="2" rx="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path></svg></span>Instagram</button>
<button type="button" style="height: 64px; border-radius: 14px; border: 1px solid #2a2a2a; background: #0b0b0b; color: #c9ccd1; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><span style="width: 24px; height: 24px; border-radius: 7px; background: #ff0000; color: #fff; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px"><path d="m10 15 5-3-5-3z"></path></svg></span>YouTube</button>
<button type="button" style="height: 64px; border-radius: 14px; border: 1px solid #2a2a2a; background: #0b0b0b; color: #c9ccd1; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><span style="width: 24px; height: 24px; border-radius: 7px; background: #222222; color: #f5f5f5; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 12px; height: 12px"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></span>Other</button>
</div></div>

<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 600">Link name
<input type="text" value="TikTok bio" style="height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #3a3a3a; background: #0b0b0b; color: #f5f5f5; font-family: inherit; font-size: 14px; outline: none; box-shadow: 0 0 0 3px rgba(255, 214, 0, 0.25)">
<span style="font-size: 12px; font-weight: 400; color: #9ca3af">Only you see this name.</span></label>

<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 600">Opens
<button type="button" style="height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #2a2a2a; background: #0b0b0b; color: #f5f5f5; font-family: inherit; font-size: 14px; display: flex; align-items: center; gap: 10px; text-align: left"><span style="flex-grow: 1">Product website <span style="color: #9ca3af">· lexinotes.example.com</span></span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px; color: #9ca3af"><path d="m6 9 6 6 6-6"></path></svg></button></label>

<div style="display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 14px; background: #0b0b0b; border: 1px dashed #3a3a3a"><span style="font-size: 12px; font-weight: 600; color: #9ca3af">Your link</span><span style="font-family: ui-monospace, Menlo, monospace; font-size: 14px; font-weight: 600">boostlink.app/r/lexi-notes/<span style="color: #ffd600">tiktok-bio</span></span></div>

<div style="display: flex; justify-content: flex-end; gap: 8px; padding-top: 4px">
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #3a3a3a; background: transparent; color: #f5f5f5; font-family: inherit; font-weight: 600; font-size: 14px">Cancel</button>
<button type="button" style="height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: #ffd600; color: #111111; font-family: inherit; font-weight: 700; font-size: 14px">Create and copy</button>
</div>
</div>
</div>


</body>
</html>
